name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "cpumon-${{ github.ref_name }}-x86_64-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/cpumon.exe, target/release/cpumonw.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: cpumon-${{ github.ref_name }}-x86_64-windows.zip
          generate_release_notes: true
